# Database passwords are not shipped with defaults: set them in the
# environment or a .env file before starting the stack. Compose fails
# fast with an error message if any of them is unset.
services:
  mantisbt:
    image: xlrl/mantisbt:latest
    volumes:
      - ./config:/var/www/html/config
      - ./custom:/var/www/html/custom
    environment:
      - MANTIS_TIMEZONE=Europe/Berlin
      - MANTIS_ENABLE_ADMIN=0
    ports:
      - '8989:80'
    restart: always
    links:
      - mysql

  mysql:
    image: mariadb:latest
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment or a .env file}
      - MYSQL_DATABASE=bugtracker
      - MYSQL_USER=mantis
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment or a .env file}
    restart: always

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or a .env file}
    restart: always
